name: Validate AETHER Community Pack
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  aether-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build matching native engine
        working-directory: terra2-engine
        run: gradle --no-daemon :platforms:bukkit:build :platforms:bukkit:nms:test :common:addons:config-noise-function:test
      - name: Resolve Paper API for the runtime probe
        run: |
          mkdir -p /tmp/terra2-probe-api
          printf '%s\n' '<project><modelVersion>4.0.0</modelVersion><groupId>org.terra2</groupId><artifactId>probe</artifactId><version>1</version><repositories><repository><id>paper</id><url>https://repo.papermc.io/repository/maven-public/</url></repository></repositories><dependencies><dependency><groupId>io.papermc.paper</groupId><artifactId>paper-api</artifactId><version>26.2.build.133-stable</version></dependency></dependencies></project>' > /tmp/terra2-probe-api/pom.xml
          mvn --batch-mode --no-transfer-progress --file /tmp/terra2-probe-api/pom.xml dependency:copy-dependencies -DoutputDirectory="$HOME/.gradle/caches/terra2-probe-api"
      - name: Load AETHER, generate islands and verify save/restart
        run: python3 terra2-engine/tools/paper-aether-smoke.py
      - name: Upload pack and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-pack-validation
          path: |
            terra2-engine/build/aether-smoke/plugins/Terra2/packs/AETHER-0.2.0-terra2.zip
            terra2-engine/build/aether-smoke/*.log
            terra2-engine/build/aether-smoke/plugins/Terra2/reports/**
