name: Build Terra 2.0

on:
  push:
    paths:
      - 'terra2-plugin/**'
      - '.github/workflows/build-terra2.yml'
  pull_request:
    paths:
      - 'terra2-plugin/**'
      - '.github/workflows/build-terra2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-26-2:
    name: Official Paper 26.2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra2-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Terra2-plugin
          path: terra2-plugin/target/Terra2-*.jar
          if-no-files-found: error

  compatibility-26-3:
    name: Compatibility Paper 26.3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra2-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test against Paper 26.3
        run: mvn --batch-mode --no-transfer-progress '-Dpaper.version=[26.3.build,26.4.build)' verify
