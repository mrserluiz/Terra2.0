name: Build Terra 2.0

on:
  push:
    paths:
      - 'terra2-plugin/**'
      - 'terra2-engine/**'
      - '.github/workflows/build-terra2.yml'
  pull_request:
    paths:
      - 'terra2-plugin/**'
      - 'terra2-engine/**'
      - '.github/workflows/build-terra2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-26-2:
    name: Official Paper 26.2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra2-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Validate packaged plugin descriptor
        run: |
          unzip -p target/Terra2-*.jar plugin.yml > /tmp/terra2-plugin.yml
          grep -F "version: '0.2.0-SNAPSHOT'" /tmp/terra2-plugin.yml
          if grep -E '^(depend|softdepend):.*Terra' /tmp/terra2-plugin.yml; then
            echo "plugin.yml must not depend on the legacy Terra plugin"
            exit 1
          fi
          if grep -F '${project.version}' /tmp/terra2-plugin.yml; then
            echo "plugin.yml still contains an unresolved Maven placeholder"
            exit 1
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Terra2-plugin
          path: terra2-plugin/target/Terra2-*.jar
          if-no-files-found: error

  compatibility-26-3:
    name: Compatibility Paper 26.3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra2-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test against Paper 26.3
        run: mvn --batch-mode --no-transfer-progress '-Dpaper.version=[26.3.build,26.4.build)' verify

  recovered-engine-26-2:
    name: Recovered engine / Paper 26.2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra2-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle required by Paperweight
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Compile and test the Paper engine
        run: gradle --no-daemon --stacktrace :platforms:bukkit:build :common:implementation:terra2-core:test :common:implementation:vanilla-adapter:test :platforms:bukkit:common:test :platforms:bukkit:nms:test :common:implementation:base:test

      - name: Inspect native worldgen adapter signatures
        if: success()
        run: bash tools/inspect-paper-worldgen.sh

      - name: Upload experimental engine JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Terra2-engine-experimental-26.2
          path: terra2-engine/platforms/bukkit/build/libs/Terra2-bukkit-7.0.17-BETA.jar
          if-no-files-found: error

      - name: Inspect current server adapter signatures after failure
        if: failure()
        run: |
          find . "$HOME/.gradle/caches" -name '*.jar' -type f | while read -r candidate; do
            if jar tf "$candidate" 2>/dev/null | grep -q '^net/minecraft/world/level/biome/Biome.class$'; then
              echo "Adapter API: $candidate"
              javap -private -classpath "$candidate" net.minecraft.world.level.biome.Biome net.minecraft.world.level.biome.Biome\$BiomeBuilder net.minecraft.world.level.biome.BiomeSpecialEffects net.minecraft.world.level.biome.BiomeSpecialEffects\$Builder net.minecraft.world.attribute.EnvironmentAttributes net.minecraft.world.attribute.EnvironmentAttributeMap net.minecraft.world.attribute.AmbientParticle net.minecraft.world.attribute.AmbientSounds net.minecraft.world.attribute.BackgroundMusic net.minecraft.resources.Identifier net.minecraft.core.MappedRegistry net.minecraft.world.level.chunk.status.WorldGenContext || true
              break
            fi
          done
