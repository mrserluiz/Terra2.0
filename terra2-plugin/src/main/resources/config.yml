# O plugin nunca começa a gerar mundos automaticamente.
generation:
  enabled: false
  affect-existing-worlds: false
  generate-new-chunks-only: true
  require-explicit-world-selection: true

# Cada mundo deve ser autorizado individualmente. Vazio = nenhuma ação.
worlds: {}

# Exemplo seguro (mantenha comentado até a confirmação do administrador):
# worlds:
