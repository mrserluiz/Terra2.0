id: EQ_AETHER_ISLANDS
type: BIOME
abstract: true
terrain:
  blend:
    distance: 0
  sampler:
    dimensions: 3
    type: MINECRAFT_INTERPOLATED
    cell-width: 8
    cell-height: 4
    # squeeze is sign-preserving. Leave it outside Terra's second 4-block interpolation:
    # the unsqueezed field is piecewise trilinear and preserves the original solid/air boundary.
    squeeze: false
    sampler:
      dimensions: 3
      type: EXPRESSION
      expression: -0.15 + min(max((y-8)/32,0),1)*(-0.1 + min(max((128-y)/72,0),1)*(0.07 + aetherNoise(x,y,z)))
      samplers:
        aetherNoise:
          dimensions: 3
          type: MINECRAFT_OLD_BLENDED_NOISE
          xz-scale: 0.25
          y-scale: 0.25
          xz-factor: 80
          y-factor: 160
          smear-scale-multiplier: 8
  sampler-2d:
    dimensions: 2
    type: CONSTANT
    value: 0
carving:
  sampler:
    dimensions: 3
    type: CONSTANT
    value: 0
