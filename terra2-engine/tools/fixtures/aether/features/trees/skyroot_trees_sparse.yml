id: SKYROOT_TREES_SPARSE
type: FEATURE
distributor:
  type: PADDED_GRID
  width: 24
  padding: 3
  salt: 18273
locator:
  type: AND
  locators:
    - type: TOP
      range: &range { min: 8, max: 129 }
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: [ minecraft:grass_block, minecraft:dirt ]
        offset: -1
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: [ minecraft:air ]
        offset: 0
structures:
  distribution: { type: WHITE_NOISE }
  structures:
    - skyroot_tree: 4
    - golden_oak_tree: 1
