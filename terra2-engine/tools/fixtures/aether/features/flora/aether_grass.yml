id: AETHER_GRASS
type: FEATURE
distributor:
  type: SAMPLER
  sampler: { type: POSITIVE_WHITE_NOISE, salt: 37146 }
  threshold: 0.10
locator:
  type: AND
  locators:
    - type: TOP
      range: &range { min: 48, max: 180 }
    - type: PATTERN
      range: *range
      pattern: { type: MATCH_SET, blocks: [ minecraft:grass_block ], offset: -1 }
structures:
  distribution: { type: WHITE_NOISE }
  structures:
    - BLOCK:minecraft:short_grass: 8
    - BLOCK:minecraft:fern: 2
    - BLOCK:minecraft:tall_grass: 1
