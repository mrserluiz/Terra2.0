# This file controls the recovered Terra2 engine, independently of upstream config.yml.
# Installing the plugin never authorizes a world or changes its generator.
# Command help and world-authorization messages; existing technical diagnostics retain their original causes.
# en_US, es_ES, id_ID, it_IT, fr_FR, de_DE, pt_BR, ru_RU, pl_PL, vi_VN, tr_TR, zh_CN, ja_JP
language: pt_BR
generation:
  enabled: false
  protected-worlds: [world, world_nether, world_the_end]
# Exact world name -> Community Pack ID. Empty by default.
# Vanilla importer (first release: flat terrain only, no features/structures):
# worlds:
#   terra2_dp_teste:
#     datapack: terra2-flat-demo
#     dimension: terra2_demo:flat
# Source lives in plugins/Terra2/datapacks/; do not install it in world/datapacks.
# Create with /mv create terra2_dp_teste normal --generator Terra2:DATAPACK
# Inspect first: /terra2 datapack inspect terra2-flat-demo terra2_demo:flat
# Compositions: choose exactly one terrain base, then READY converted extensions.
#   terra2_mix_teste:
#     packs: [OVERWORLD, Debris]
# Equivalent: pack: OVERWORLD;Debris
# Create with --generator Terra2:PACKS after /terra2 reload.
# Convert inputs separately: /terra2 convert Debris scatter-demo
worlds: {}
