name: "Terra2"
main: "com.dfsek.terra.bukkit.TerraBukkitPlugin"
version: "@VERSION@"
load: "STARTUP"
authors: [ "dfsek", "duplexsystem", "Astrash", "solonovamax", "Sancires", "Aureus", "RogueShade", "OakLoaf" ]
website: "@WIKI@"
api-version: "26.2"
description: "@DESCRIPTION@"
folia-supported: true

commands:
  terra2reportlog:
    description: Captura o console durante testes de geração
    usage: /terra2reportlog [start|stop|status]
    permission: terra2.diagnostics.capture
  terra2:
    description: Gerencia autorizações e inspeciona datapacks vanilla
    usage: /terra2 reload | /terra2 datapack list | /terra2 datapack inspect <arquivo> [dimensão]
    permission: terra2.settings.reload
permissions:
  terra2.diagnostics.capture:
    description: Permite iniciar e encerrar a captura do console
    default: op
  terra2.settings.reload:
    description: Permite recarregar as autorizações do Terra2
    default: op
